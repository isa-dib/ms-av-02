spring.application.name=login-service

# Banco de dados H2 em memória
spring.datasource.url=jdbc:h2:mem:logindb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.h2.console.enabled=true

# Regra de bloqueio: o usuário é bloqueado quando falhar MAIS de "max-falhas" vezes
login.max-falhas=1

# Operadores da API (Spring Security / JdbcUserDetailsManager)
seguranca.admin.username=admin
seguranca.admin.password=admin123
seguranca.manutencao.username=manutencao
seguranca.manutencao.password=manut123

# OpenAPI / Swagger
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Actuator / métricas
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=always
management.metrics.tags.application=${spring.application.name}
management.info.java.enabled=true
info.app.name=@project.name@
info.app.description=@project.description@
info.app.version=@project.version@
